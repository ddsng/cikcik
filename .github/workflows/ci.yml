name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["site/data/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Smoke test (demo mode)
        run: python -m idxanalyzer run --demo --tickers BBCA,TLKM,ASII --out /tmp/site
