[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idxanalyzer"
version = "0.1.0"
description = "Analisa teknikal & fundamental saham Bursa Efek Indonesia"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
idxanalyzer = "idxanalyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
